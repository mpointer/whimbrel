[package]
name = "mcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
memory = { path = "../memory" }
llm = { path = "../llm" }
rmcp = { version = "3", features = ["transport-streamable-http-server"] }
# Matched to the version rmcp 3.0.1 itself already resolves to in this workspace's
# Cargo.lock (schemars 1.2.2) rather than the older 0.8 line — rmcp's macros emit
# `schema_for_output`/`schema_for_input` calls against this crate's `JsonSchema` trait,
# so a mismatched major version would fail to satisfy `Json<T>`'s trait bounds.
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
chrono = "0.4"
# Auth middleware (Task 3): a standalone tower::Layer/Service wrapping the axum::Router
# that Task 4 nests the StreamableHttpService under (see auth.rs's module doc for why
# this is possible without touching rmcp's own request dispatch).
axum = "0.8"
tower = "0.5"
http = "1"
# Token hashing (generate_token/hash_secret/verify_secret) moved to core/memory's
# token.rs (Task 5) so core/ffi can share it without depending on this crate; this
# crate now uses those functions via `memory::token` (re-exported from auth.rs), so
# rand/hex/subtle/sha2 are no longer direct dependencies here.

[[bin]]
name = "whimbrel-mcp-server"
path = "src/bin/whimbrel-mcp-server.rs"

[dev-dependencies]
tempfile = "3"
# Client-side streamable-HTTP transport (Task 4's real_client_integration test only —
# the main [dependencies] `rmcp` entry above only needs the server-side feature). Cargo
# unifies this crate's feature set across [dependencies]/[dev-dependencies] for test
# builds, so this doesn't create a second, conflicting `rmcp` resolution.
rmcp = { version = "3", features = ["client", "reqwest", "transport-streamable-http-client-reqwest"] }
