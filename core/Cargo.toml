[workspace]
resolver = "2"
members = [
    "ingest",
    "api",
    "memory",
    "transcribe",
    "diarize",
    "llm",
    "agent",
    "mcp-host",
    "mcp-server",
    "routines",
    "sync",
    "sync-engine",
    "skins",
    "ffi",
    "eval",
    # Tests that need libsql's `core` feature (a local relay); kept out of api so api's
    # tests can run on SQLCipher. See its Cargo.toml.
    "phone-tests",
    "sealed",
    "cloud-runner",
]

[workspace.package]
version = "0.9.82"
edition = "2021"
license = "Apache-2.0"
publish = false

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
