[package]
name = "eval"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The evaluation harness: a seeded synthetic corpus, question sets derived from its
# answer key, retrieval and answer metrics, the pass^k routine suite shape, the summary
# preference record, and a CLI that compares a run against a committed baseline.
# docs/superpowers/specs/2026-11-04-eval-harness-design.md. Nothing depends on it.

[dependencies]
memory = { path = "../memory" }
llm = { path = "../llm" }
api = { path = "../api" }
chrono = "0.4"
rand = "0.8"
# Same version as core/memory: the store's errors are `rusqlite::Error`.
rusqlite = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "eval"
path = "src/main.rs"
