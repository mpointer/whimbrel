[package]
name = "memory"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Additive: memory keeps the default `bundled` SQLite; this switches rusqlite to vendored
# SQLCipher (bundled OpenSSL). Phones build without it and `open_keyed` returns Err.
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]
# Benchmark-only pragma hooks (can turn HMAC / secure_delete off). Never enable in a product build.
bench-hooks = []

[dependencies]
regex = "1"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlite-vec = "0.1.9"
candle-transformers = "0.11"
tokenizers = "0.20"
# MCP client token generation/verification (src/token.rs), shared by core/ffi
# (Swift-facing generation) and core/mcp-server (auth verification) — moved here from
# core/mcp-server so core/ffi doesn't need to depend on mcp-server itself. Versions
# matched to what's already resolved in core/Cargo.lock (rand 0.8.7, hex 0.4.3,
# subtle 2.6.1, sha2 0.10.9) from mcp-server's prior use of these same crates.
rand = "0.8"
hex = "0.4"
subtle = "2"
sha2 = "0.10"
# Keyed hash of a client-deleted added item (mcp_items.rs): the forgotten record never holds the id.
hmac = "0.12"
# DbKey wipes its bytes on drop (already in the lockfile via other crates).
zeroize = "1"
# Skin image chunks on the wire (skin_sync.rs).
base64 = "0.22"
# Word folding for client-name matching and word fingerprints (words.rs), shared with llm::guard.
icu_normalizer = { version = "2.2.0", default-features = false, features = ["compiled_data"] }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", features = ["accelerate"] }
candle-nn = { version = "0.11", features = ["accelerate"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-core = "0.11"
candle-nn = "0.11"

# fs_atomic::move_no_replace (renamex_np / renameat2; MoveFileExW without replace on Windows).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
# Only the bench harness uses it: the seeded synthetic corpus generator.
eval = { path = "../eval" }

[[bench]]
name = "encryption_cost"
harness = false
required-features = ["bench-hooks"]
