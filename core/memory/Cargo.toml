[package]
name = "memory"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
regex = "1"
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlite-vec = "0.1.9"
candle-transformers = "0.8"
tokenizers = "0.20"
# MCP client token generation/verification (src/token.rs), shared by core/ffi
# (Swift-facing generation) and core/mcp-server (auth verification) — moved here from
# core/mcp-server so core/ffi doesn't need to depend on mcp-server itself. Versions
# matched to what's already resolved in core/Cargo.lock (rand 0.8.7, hex 0.4.3,
# subtle 2.6.1, sha2 0.10.9) from mcp-server's prior use of these same crates.
rand = "0.8"
hex = "0.4"
subtle = "2"
sha2 = "0.10"
# Skin image chunks on the wire (skin_sync.rs).
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.8", features = ["accelerate"] }
candle-nn = { version = "0.8", features = ["accelerate"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-core = "0.8"
candle-nn = "0.8"

[dev-dependencies]
tempfile = "3"
