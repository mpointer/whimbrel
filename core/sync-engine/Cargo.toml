[package]
name = "sync-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
sqlcipher = ["memory/sqlcipher"]

[dependencies]
sync = { path = "../sync" }
memory = { path = "../memory" }
# `tls` is off: libsql's own connector is hyper-rustls 0.25 on rustls 0.22, which has
# open advisories. src/tls.rs builds the connector on rustls 0.23 and every remote
# Builder is handed it.
libsql = { version = "0.9", default-features = false, features = ["remote"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tracing = "0.1"
hyper = { version = "0.14", features = ["client", "http1", "tcp"] }
tower-service = "0.3"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"

[target.'cfg(not(target_os = "android"))'.dependencies]
rustls-native-certs = "0.8"

[dev-dependencies]
tempfile = "3"
libsql = { version = "0.9", default-features = false, features = ["core"] }
tokio = { version = "1", features = ["test-util"] }
