[package]
name = "api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Pure-Rust orchestration layer between the platform shells and the core crates —
# docs/12-windows-app-design.md §3 and docs/superpowers/plans/2026-09-07-core-api-split.md.
# Deliberately depends only on crates that build on every NFR-PRT-3 target: never on
# transcribe/diarize (native toolchains) and never on libsql's `core` feature (MSVC
# LNK2005 against rusqlite's bundled SQLite — see the design doc §3).

[dependencies]
memory = { path = "../memory" }
llm = { path = "../llm" }
routines = { path = "../routines" }
# api::write_action (M3.0 Task 7) decodes the drafted payload routines persisted.
agent = { path = "../agent" }
# api::sync_ops::coordinators (M3.0 Task 12): the settings-sync round trip.
sync = { path = "../sync" }
sync-engine = { path = "../sync-engine" }
chrono = "0.4"
# Same version as core/memory: functions here surface the `rusqlite::Error` that
# `memory::Store` methods already return through their public signatures.
rusqlite = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# api::models (M3.0 Task 3): blocking downloads (same ureq as core/llm) and the
# .tar.bz2 unpack that used to shell out to /usr/bin/tar. Same bzip2 line the
# workspace already builds for sherpa-onnx-sys.
tar = "0.4"
bzip2 = { version = "0.4", features = ["static"] }
# api::update (M3.0 Task 4): streamed SHA-256 of a staged update; same lines as core/memory.
sha2 = "0.10"
hex = "0.4"
# api::hosted_models (M3.0 Task 5): blocking model-list fetches, same ureq as core/llm.
ureq = { version = "2", features = ["json"] }
# api::connectors (M3.0 Task 8): conference-link detection in calendar event text.
regex = "1"
# api::oauth (M3.0 Task 10): PKCE randomness/encoding, consent-URL building, the same
# ureq as core/llm for the token endpoints.
rand = "0.8"
base64 = "0.22"
url = "2"
# api::sync_ops::enrollment (M3.0 Task 11): the sync Worker client, same ureq as core/llm.
# Inference run registry (api::inference, docs/adr/0002) — owns its own runtime,
# entirely separate from however the shell serializes Store access.
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
# tests/phone_meeting_count.rs: a local libsql file as the relay, as sync-engine's tests do.
libsql = { version = "0.9", default-features = false, features = ["core"] }
tokio = { version = "1", features = ["macros"] }
