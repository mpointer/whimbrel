<section class="share-block" data-share aria-labelledby="share-title" data-copied="Copié." data-failed="Copie impossible. Sélectionnez le texte et copiez-le.">
  <div class="container narrow">
    <h2 id="share-title">Parlez-en à un ami</h2>
    <p>Vous connaissez quelqu'un qui aimerait Whimbrel ? Envoyez-lui ceci.</p>
    <p class="share-message" data-share-message>J'utilise Whimbrel pour mes notes de réunion. Il enregistre sans robot, et mes enregistrements restent sur mon ordinateur. Gratuit pour Mac et Windows : https://whimbrelapp.com/fr/</p>
    <button class="btn btn-ghost" type="button" data-share-button hidden>Copier le message</button>
    <p class="share-status" data-share-status role="status"></p>
  </div>
</section>
