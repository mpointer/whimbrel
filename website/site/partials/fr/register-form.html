<form class="register card" id="register-form" action="/api/register" method="post" novalidate data-turnstile-sitekey="{{site.turnstileSiteKey}}">
  <div class="form-alert" role="alert" hidden></div>
  <div class="field-row">
    <div class="field">
      <label for="reg-name">Nom complet</label>
      <input id="reg-name" name="name" type="text" autocomplete="name" required maxlength="100">
      <p class="field-error" data-for="name"></p>
    </div>
    <div class="field">
      <label for="reg-email">Courriel professionnel</label>
      <input id="reg-email" name="email" type="email" autocomplete="email" required maxlength="254" inputmode="email">
      <p class="field-error" data-for="email"></p>
    </div>
  </div>
  <div class="field-row">
    <div class="field">
      <label for="reg-company">Entreprise <span class="optional">(facultatif)</span></label>
      <input id="reg-company" name="company" type="text" autocomplete="organization" maxlength="200">
    </div>
    <div class="field">
      <label for="reg-role">Votre rôle <span class="optional">(facultatif)</span></label>
      <select id="reg-role" name="role">
        <option value="">Choisir</option>
        <option value="executive">Cadre dirigeant</option>
        <option value="manager">Gestionnaire / chef d’équipe</option>
        <option value="individual-contributor">Contributeur individuel</option>
        <option value="engineer">Ingénieur / développeur</option>
        <option value="sales">Ventes / relation client</option>
        <option value="consultant">Consultant / agence</option>
        <option value="founder">Fondateur</option>
        <option value="other">Autre</option>
      </select>
    </div>
  </div>
  <div class="field-row">
    <fieldset class="field platform-choice">
      <legend>Télécharger pour</legend>
      <label class="choice"><input type="radio" name="platform" value="mac" required> <span>Mac <small>Apple silicon</small></span></label>
      <label class="choice"><input type="radio" name="platform" value="windows"> <span>Windows <small>64 bits</small></span></label>
      <p class="field-error" data-for="platform"></p>
    </fieldset>
    <div class="field">
      <label for="reg-team">Taille de l’équipe <span class="optional">(facultatif)</span></label>
      <select id="reg-team" name="teamSize">
        <option value="">Choisir</option>
        <option value="1">Juste moi</option>
        <option value="2-10">2–10</option>
        <option value="11-50">11–50</option>
        <option value="51-200">51–200</option>
        <option value="201-1000">201–1 000</option>
        <option value="1000+">1 000+</option>
      </select>
    </div>
  </div>
  <label class="checkbox"><input type="checkbox" name="marketingOptIn" value="true"> Envoyez-moi par courriel les notes de version et les nouveautés du produit. Désabonnement possible en tout temps.</label>
  <div class="hp" aria-hidden="true"><label for="reg-hp">Laissez ce champ vide</label><input id="reg-hp" name="whimbrel_hp" type="text" tabindex="-1" autocomplete="off"></div>
  <input type="hidden" name="utm_source"><input type="hidden" name="utm_medium"><input type="hidden" name="utm_campaign">
  <input type="hidden" name="referrer"><input type="hidden" name="landing_page"><input type="hidden" name="signup_language" value="fr">
  <div class="turnstile"></div>
  <button class="btn btn-primary btn-lg btn-block" type="submit">S’inscrire et télécharger</button>
  <p class="fine muted">Gratuit et libre. Nous utilisons vos renseignements pour vous donner accès au téléchargement et, si vous y consentez, pour vous envoyer des nouveautés du produit. Consultez notre <a href="/privacy/">politique de confidentialité</a>.</p>
</form>
