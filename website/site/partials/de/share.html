<section class="share-block" data-share aria-labelledby="share-title" data-copied="Kopiert." data-failed="Kopieren nicht möglich. Markieren Sie den Text und kopieren Sie ihn.">
  <div class="container narrow">
    <h2 id="share-title">Weiterempfehlen</h2>
    <p>Kennen Sie jemanden, dem Whimbrel gefallen würde? Schicken Sie ihm das hier.</p>
    <p class="share-message" data-share-message>Ich nutze Whimbrel für meine Meeting-Notizen. Es nimmt ohne Bot auf, und meine Aufnahmen bleiben auf meinem Computer. Kostenlos für Mac und Windows: https://whimbrelapp.com/de/</p>
    <button class="btn btn-ghost" type="button" data-share-button hidden>Nachricht kopieren</button>
    <p class="share-status" data-share-status role="status"></p>
  </div>
</section>
