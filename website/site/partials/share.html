<section class="share-block" data-share aria-labelledby="share-title" data-copied="Copied." data-failed="Could not copy. Select the text and copy it.">
  <div class="container narrow">
    <h2 id="share-title">Tell a friend</h2>
    <p>Know someone who would like Whimbrel? Send them this.</p>
    <p class="share-message" data-share-message>I use Whimbrel for my meeting notes. It records without a bot, and my recordings stay on my computer. Free for Mac and Windows: https://whimbrelapp.com</p>
    <button class="btn btn-ghost" type="button" data-share-button hidden>Copy message</button>
    <p class="share-status" data-share-status role="status"></p>
  </div>
</section>
