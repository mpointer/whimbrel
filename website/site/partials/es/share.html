<section class="share-block" data-share aria-labelledby="share-title" data-copied="Copiado." data-failed="No se pudo copiar. Selecciona el texto y cópialo.">

    <h2 id="share-title">Cuéntaselo a un amigo</h2>
    <p>¿Conoces a alguien a quien le gustaría Whimbrel? Envíale esto.</p>

  </div>
</section>
