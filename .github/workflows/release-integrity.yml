name: Release integrity

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only a PR cancels what it supersedes; main and tags always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-version:
    # Not on a branch push to main (#ci-minutes): the PR already ran this on the
    # same code. Tag pushes (releases), manual runs and ready PRs still run it.
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
    # On the maintainer's Mac in the private repo (no billed minutes); GitHub-hosted in the
    # public mirror and for a pull request from a fork, so outside code never runs on it.
    # With the repository variable MAC_BIG_CI set to on, either Mac runner takes it (label mac-pool; an internal runbook covers it).
    runs-on: ${{ github.repository == 'mpointer/kestrel' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.MAC_BIG_CI == 'on' && '["self-hosted","mac-pool"]' || '["self-hosted","macOS"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      run_connectors: ${{ steps.connectors.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      # Decides whether connector-dist runs, here rather than in a job of its own:
      # every job bills at least a minute (#ci-minutes). On a PR it runs only when the
      # diff touches mcp-servers/ or the workflows; most PRs (website, windows, mac,
      # android) never do. Tags and manual runs always build the connectors, as does an
      # empty or failed diff. First step, so the output is set even if check-version.sh
      # fails below.
      - id: connectors
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          run=true
          if [ -n "$base" ] && git fetch -q --depth=1 origin "$base" && changed="$(git diff --name-only "$base" HEAD)"; then
            if [ -n "$changed" ] && ! grep -qE '^(mcp-servers/|\.github/workflows/)' <<<"$changed"; then
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "connector-dist will run: $run"
      - name: Run check-version.sh against the repo's own state
        run: scripts/check-version.sh
      - name: Run check-version.sh's own test suite
        run: scripts/test-check-version.sh

  # Each connector's dist/ is committed and is what the app bundles; release-publish.sh
  # never compiles src/, so a src change without a rebuilt dist/ ships nothing (0.9.11's
  # Gmail 404 fix did exactly that).
  connector-dist:
    # Runs when check-version says so (see its connectors step); skipped with it on a
    # branch push to main. One job building all three connectors, not a three-job
    # matrix: each build takes seconds, and every job bills at least a minute.
    needs: check-version
    if: ${{ !cancelled() && needs.check-version.outputs.run_connectors == 'true' }}
    # On the maintainer's Mac in the private repo (no billed minutes); GitHub-hosted in the
    # public mirror and for a pull request from a fork, so outside code never runs on it.
    # With the repository variable MAC_BIG_CI set to on, either Mac runner takes it (label mac-pool; an internal runbook covers it).
    runs-on: ${{ github.repository == 'mpointer/kestrel' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.MAC_BIG_CI == 'on' && '["self-hosted","mac-pool"]' || '["self-hosted","macOS"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          # GitHub's npm cache only on hosted runners: on the Mac it can't resolve its paths
          # ("Some specified paths were not resolved"), and the Mac keeps its own npm cache.
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: |
            mcp-servers/gmail/package-lock.json
            mcp-servers/google-calendar/package-lock.json
            mcp-servers/outlook365/package-lock.json
      # Checks every connector before failing, so one run reports all stale dist/ folders.
      - name: Build each connector; dist/ must match src/
        run: |
          status=0
          for c in gmail google-calendar outlook365; do
            echo "::group::$c"
            if ! (cd "mcp-servers/$c" && npm ci && npm run build); then
              echo "::error::$c failed to build"; status=1
            elif ! git diff --exit-code -- "mcp-servers/$c/dist"; then
              echo "::error::dist/ is stale -- run 'npm run build' in mcp-servers/$c and commit it"; status=1
            fi
            echo "::endgroup::"
          done
          exit $status

  # A pure version-bump commit (apps/macos/scripts/release-prepare.sh) only ever
  # touches these 5 files -- no source changed, so the swift-tests macOS runner
  # below is redundant with the CI run the fix itself already had.
  # On a pull request only when MAC_BIG_CI is on (#ci-minutes): its outputs feed only
  # swift-tests, which runs on a PR only then. The PR condition also requires the private
  # repo and a same-repo, non-draft PR, so a PR run always lands on the mac-big runner
  # and never bills a hosted minute.
  changes:
    if: github.event_name != 'pull_request' || (vars.MAC_BIG_CI == 'on' && github.repository == 'mpointer/kestrel' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    # On the maintainer's Mac in the private repo (no billed minutes); GitHub-hosted in the
    # public mirror and for a pull request from a fork, so outside code never runs on it.
    # With the repository variable MAC_BIG_CI set to on, either Mac runner takes it (label mac-pool; an internal runbook covers it).
    runs-on: ${{ github.repository == 'mpointer/kestrel' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.MAC_BIG_CI == 'on' && '["self-hosted","mac-pool"]' || '["self-hosted","macOS"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      version_only: ${{ steps.filter.outputs.version_only }}
      run_macos: ${{ steps.filter.outputs.run_macos }}
    steps:
      # ref pinned to the real commit (not actions/checkout@v4's pull_request default,
      # GitHub's ephemeral refs/pull/N/merge preview ref -- observed transiently
      # returning "Repository not found" under concurrent access) and full history, so
      # the diff below has both endpoints regardless of push/pull_request event.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      # Plain git diff, not dorny/paths-filter: its predicate-quantifier: every checks
      # "does every PATTERN match some changed file" (AND across patterns) -- not "is
      # every CHANGED FILE covered by some pattern" (the whitelist/exhaustiveness check
      # this actually needs. There's no paths-filter mode for the latter. Confirmed
      # broken in practice: PR #72, a genuine version-bump-only diff of exactly these 5
      # files, evaluated version_only=false.
      - id: filter
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          changed="$(git diff --name-only "$base" "$head")" || changed=""
          allowed='^(VERSION|apps/macos/project\.yml|apps/macos/Whimbrel\.xcodeproj/project\.pbxproj|core/Cargo\.toml|core/Cargo\.lock)$'
          if [ -n "$changed" ] && ! grep -vqE "$allowed" <<<"$changed"; then
            version_only=true
          else
            version_only=false
          fi
          echo "version_only=$version_only" >> "$GITHUB_OUTPUT"
          # swift-tests builds the Mac app, which links core/ and bundles the
          # connectors, so it runs only when one of those (or these workflows)
          # changed. An empty or failed diff runs it.
          # One path list for every event, core/ included (a PR runs this only when
          # MAC_BIG_CI is on, and then swift-tests runs for core/ changes too).
          macos_paths='^(apps/macos/|core/|mcp-servers/|scripts/l10n/|l10n/|\.github/workflows/)'
          if [ "$version_only" = false ] && { [ -z "$changed" ] || grep -qE "$macos_paths" <<<"$changed"; }; then
            echo "run_macos=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_macos=false" >> "$GITHUB_OUTPUT"
          fi

  # macOS runners bill at 10x a Linux minute, and xcodebuild has no Linux
  # equivalent. This is the only check that the Mac app compiles, so it runs on
  # PRs as well as on main, but only when the diff can affect the app (see
  # run_macos above). The Rust cache covers the core/ build its prebuild
  # script runs.
  #
  # Isolation: this job's test host is Whimbrel.app under its real bundle id, so on
  # a dev's own login it shares that account's real UserDefaults/Application Support
  # with the installed app. The M3.0 Task 9 migration shim clears legacy
  # connected-account keys on every host-app launch, so a run in Mike's own account
  # can wipe the real connected Google/Microsoft account settings. The mac-big runner
  # runs under a separate macOS user account, which is the isolation this needs.
  swift-tests:
    needs: changes
    # Pushes and manual runs (workflow_dispatch on a branch) as before. On a pull request
    # only when MAC_BIG_CI is on, and only a ready, same-repo PR (never a fork's code).
    # The mirror has no runner, so the job would queue there forever.
    if: needs.changes.outputs.run_macos == 'true' && github.repository == 'mpointer/kestrel' && (github.event_name != 'pull_request' || (vars.MAC_BIG_CI == 'on' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository))
    # A pull request run always goes to mac-big, even if the variable flips to off between
    # queueing and a re-run, so a PR's code never runs in Mike's own account.
    # Keep this on mac-big, never the shared mac-pool label: this Mac's runner also carries
    # mac-pool, and it runs in Mike's own account.
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' || vars.MAC_BIG_CI == 'on') && '["self-hosted","mac-big"]' || '["self-hosted","macOS"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # The WhimbrelUI package (the Thread screens and their rules) has its own tests, run with
      # `swift test`. They need no app build, no Rust and no signing, so they run first and fail fast.
      # Same gating as the rest of this job (pushes to main, tags and manual runs; a pull request only
      # when MAC_BIG_CI is on), so a PR never bills a Mac minute that is skipped today. Debug, then
      # release with testing enabled, which is how the package is compiled inside the app.
      - name: WhimbrelUI package tests (debug)
        working-directory: apps/macos/WhimbrelUI
        run: swift test
      - name: WhimbrelUI package tests (release)
        working-directory: apps/macos/WhimbrelUI
        run: swift test -c release -Xswiftc -enable-testing
      # Self-hosted runners use their preinstalled, isolated toolchain (CARGO_HOME and
      # RUSTUP_HOME in the runner's .env) rather than a toolchain action.
      - name: Rust toolchain (preinstalled on this runner)
        run: |
          rustup show active-toolchain
          cargo --version
      # cache-bin: false keeps rustup alive on a self-hosted runner. This is the Mac cache's
      # only saver, since checkout clears core/target: main saves it, `test` restores it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Re-download sherpa-onnx libraries the cache left out
        # sherpa-onnx-sys's build script downloads its static libraries into
        # core/target/sherpa-onnx-prebuilt and reuses that folder whenever its lib directory
        # exists, without checking the files. A restored cache can bring the folder back
        # without the libraries, while the cached build-script output still points there. Anything that
        # recompiles sherpa-onnx-sys (a Cargo.lock change) then fails with "could not find
        # native static library sherpa-onnx-c-api". When the libraries are missing, drop the
        # build script's cached output so it runs again and downloads them.
        shell: bash
        run: |
          if ! ls core/target/sherpa-onnx-prebuilt/*/lib/*sherpa-onnx-c-api.* >/dev/null 2>&1; then
            echo "No usable sherpa-onnx libraries in core/target; forcing the build script to download them"
            rm -rf core/target/sherpa-onnx-prebuilt core/target/*/build/sherpa-onnx-sys-* core/target/*/.fingerprint/sherpa-onnx-sys-*
          fi
      - name: Install Google Calendar connector dependencies
        working-directory: mcp-servers/google-calendar
        run: npm ci --omit=dev
      - name: Install Gmail connector dependencies
        working-directory: mcp-servers/gmail
        run: npm ci --omit=dev
      - name: Install Outlook 365 connector dependencies
        working-directory: mcp-servers/outlook365
        run: npm ci --omit=dev
      # Every Swift string must already be in the committed catalog. -exportLocalizations rewrites
      # the catalogs in place; export-apple.sh puts them back, so check --apple compares the export
      # against the committed files (not against a catalog the export just synced).
      - name: Check the string catalogs match the Swift source
        run: |
          scripts/l10n/export-apple.sh macos "$RUNNER_TEMP/loc"
          python3 -I scripts/l10n/translate.py check --apple "$RUNNER_TEMP/loc"/en.xcloc apps/macos/Whimbrel/Localizable.xcstrings
          python3 -I scripts/l10n/translate.py check --apple "$RUNNER_TEMP/loc"/en.xcloc apps/macos/Whimbrel/InfoPlist.xcstrings
      # The three CODE_SIGN settings at the END of the command are what "no signing credentials required" means: without
      # them Xcode signs the test bundle with whatever development certificate the runner's keychain has, and a runner with
      # no screen fails there (errSecInternalComponent). They were once in the middle of this long line and were lost in a
      # merge (#981); keep them last, and add new test classes before them.
      - name: Run UpdateCheckerTests and the meeting detector tests (no signing credentials required)
        working-directory: apps/macos
        run: xcodebuild test -project Whimbrel.xcodeproj -scheme Whimbrel -destination 'platform=macOS' -only-testing:WhimbrelTests/UpdateCheckerTests -only-testing:WhimbrelTests/SingleInstanceGuardTests -only-testing:WhimbrelTests/SyncNowModelTests -only-testing:WhimbrelTests/ScreenTextCaptureServiceTests -only-testing:WhimbrelTests/CalendarSyncHorizonTests -only-testing:WhimbrelTests/MeetingEndDetectorTests -only-testing:WhimbrelTests/MeetingHeuristicDetectorTests -only-testing:WhimbrelTests/RoutingSettingsTests -only-testing:WhimbrelTests/MediaRetentionCopyTests -only-testing:WhimbrelTests/MeetingDetailViewLogicTests -only-testing:WhimbrelTests/AwayOutcomeLabelTests -only-testing:WhimbrelTests/CoreLLMErrorDecodingTests -only-testing:WhimbrelTests/EpisodeOptionsMenuTests -only-testing:WhimbrelTests/ReadLogicTests -only-testing:WhimbrelTests/StatusMenuCopyTests -only-testing:WhimbrelTests/AppLanguageTests -only-testing:WhimbrelTests/FirstRunTests -only-testing:WhimbrelTests/ChromiumAccessibilityTests -only-testing:WhimbrelTests/RecordingNoticeTests -only-testing:WhimbrelTests/TranscriptionEngineTests -only-testing:WhimbrelTests/AwayModeSettingsTests -only-testing:WhimbrelTests/TextRecognizerTests -only-testing:WhimbrelTests/MeetingOptionsMenuTests -only-testing:WhimbrelTests/MeetingPartTranscriptionTests -only-testing:WhimbrelTests/StreamHealthTests -only-testing:WhimbrelTests/AccessQueueWaitProbeTests -only-testing:WhimbrelTests/ReplyPrioritySettingsTests -only-testing:WhimbrelTests/KeychainAccessTests -only-testing:WhimbrelTests/DbKeyStoreTests -only-testing:WhimbrelTests/KeyedStoreFFITests -only-testing:WhimbrelTests/McpServerStdinKeyTests -only-testing:WhimbrelTests/EncryptionSetupModelTests -only-testing:WhimbrelTests/EncryptionRecoveryModelTests -only-testing:WhimbrelTests/EncryptionKeyUnavailableModelTests -only-testing:WhimbrelTests/EncryptionSettingsModelTests -only-testing:WhimbrelTests/EncryptionCopyTests -only-testing:WhimbrelTests/EncryptionSecretHygieneTests -only-testing:WhimbrelTests/EncryptionSetupFFITests -only-testing:WhimbrelTests/LaunchCoordinatorTests -only-testing:WhimbrelTests/LaunchCoordinatorFFITests -only-testing:WhimbrelTests/AppLaunchTests -only-testing:WhimbrelTests/LaunchPresenterTests -only-testing:WhimbrelTests/EncryptionSettingsLiveTests -only-testing:WhimbrelTests/EncryptionPrintPageTests -only-testing:WhimbrelTests/NoStoreModeTests -only-testing:WhimbrelTests/ClientControlsModelTests -only-testing:WhimbrelTests/TopicsPaneTests -only-testing:WhimbrelTests/MeetingSnapshotServiceTests -only-testing:WhimbrelTests/AskHelpersBridgeTests -only-testing:WhimbrelTests/ThemeLoaderTests -only-testing:WhimbrelTests/ThemeStoreTests -only-testing:WhimbrelTests/ColorTokenUsageTests -only-testing:WhimbrelTests/ThemeBundleTests -only-testing:WhimbrelTests/SkinLoaderTests -only-testing:WhimbrelTests/SkinStoreTests -only-testing:WhimbrelTests/SkinGalleryTests -only-testing:WhimbrelTests/SkinDesignSystemTests -only-testing:WhimbrelTests/TodayLogicTests -only-testing:WhimbrelTests/TodayChromeTests -only-testing:WhimbrelTests/ArchetypeTerminalTests -only-testing:WhimbrelTests/ArchetypeGlassTests -only-testing:WhimbrelTests/ArchetypeFieldTests -only-testing:WhimbrelTests/ArchetypeAlmanacTests -only-testing:WhimbrelTests/ArchetypeReferenceTests -only-testing:WhimbrelTests/SkinImageryTests -only-testing:WhimbrelTests/SkinMatrixTests -only-testing:WhimbrelTests/TodayRowsTests -only-testing:WhimbrelTests/MeetingCardModelTests -only-testing:WhimbrelTests/SnapshotsStripCopyTests -only-testing:WhimbrelTests/ActiveMeetingViewTests -only-testing:WhimbrelTests/ProfileSettingsTests -only-testing:WhimbrelTests/ProfileSuggestionsModelTests -only-testing:WhimbrelTests/RoutineHostTests -only-testing:WhimbrelTests/RoutineSyncFieldsTests -only-testing:WhimbrelTests/MeetingTitleCheckSettingsTests -only-testing:WhimbrelTests/MeetingPrepSettingsTests -only-testing:WhimbrelTests/MeetingPrepDecodeTests -only-testing:WhimbrelTests/Meeti