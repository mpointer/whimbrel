name: Name check

# The product is Whimbrel; a fixed set of identifiers keeps the old name because
# they key user data or deployed resources (see scripts/rename-whimbrel.py KEEP).
# This fails if a kept identifier was renamed or a product-name string crept
# back into a user-facing file.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only a PR cancels what it supersedes; main and tags always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  name-check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/rename-whimbrel.py --check
