name: Rust tests

on:
  push:
    branches: [main]
    # No tag trigger: a release tag points at the main commit this workflow already ran on.
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["docs/**", "**/*.md"]
  # Nightly run on main (#ci-minutes). The hosted Linux jobs no longer run on a
  # push to main (the PR already ran them on the same code), so this is the
  # safety net for anything two merges break together, and it is now what saves
  # the Rust caches on main that PR runs restore from.
  schedule:
    - cron: "17 7 * * *"
  # A manual run skips the billed GitHub-hosted Linux jobs (test-linux, android) unless asked
  # (CI cost review 2026-11-17: 27 manual runs in 5 days billed about 628 Linux minutes, and the
  # sessions dispatch for the Mac and Windows jobs). `gh workflow run rust-tests.yml -f linux=true`.
  workflow_dispatch:
    inputs:
      linux:
        description: "Also run the GitHub-hosted Linux jobs (test-linux, android), which bill minutes"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only a PR cancels what it supersedes; main always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pure version-bump commit (apps/macos/scripts/release-prepare.sh) only ever
  # touches these 5 files -- no source changed, so the expensive macOS/Windows/
  # Android jobs below are redundant with the CI run the fix itself already had.
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # On the maintainer's Mac in the private repo (no billed minutes); GitHub-hosted in the
    # public mirror and for a pull request from a fork, so outside code never runs on it.
    # With the repository variable MAC_BIG_CI set to on, either Mac runner takes it (label mac-pool; an internal runbook covers it).
    runs-on: ${{ github.repository == 'mpointer/kestrel' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.MAC_BIG_CI == 'on' && '["self-hosted","mac-pool"]' || '["self-hosted","macOS"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      version_only: ${{ steps.filter.outputs.version_only }}
      run_core: ${{ steps.filter.outputs.run_core }}
      run_windows: ${{ steps.filter.outputs.run_windows }}
      run_windows_app: ${{ steps.filter.outputs.run_windows_app }}
      run_ios: ${{ steps.filter.outputs.run_ios }}
      run_android_app: ${{ steps.filter.outputs.run_android_app }}
    steps:
      # ref pinned to the real commit (not actions/checkout@v4's pull_request default,
      # GitHub's ephemeral refs/pull/N/merge preview ref -- observed transiently
      # returning "Repository not found" under concurrent access) and full history, so
      # the diff below has both endpoints regardless of push/pull_request event.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      # Plain git diff, not dorny/paths-filter: its predicate-quantifier: every checks
      # "does every PATTERN match some changed file" (AND across patterns) -- not "is
      # every CHANGED FILE covered by some pattern" (the whitelist/exhaustiveness check
      # this actually needs. There's no paths-filter mode for the latter. The list is the
      # release bump's files (12 version sources, both Cargo.locks, the npm lockfiles and
      # CHANGELOG.md, as scripts/check-version.sh knows them). Confirmed
      # broken in practice: PR #72, a genuine version-bump-only diff of exactly these 5
      # files, evaluated version_only=false.
      - id: filter
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          changed="$(git diff --name-only "$base" "$head")" || changed=""
          allowed='^(VERSION|CHANGELOG\.md|apps/macos/project\.yml|apps/macos/Whimbrel\.xcodeproj/project\.pbxproj|apps/mobile/ios/project\.yml|apps/mobile/ios/Whimbrel\.xcodeproj/project\.pbxproj|apps/windows/package\.json|apps/windows/package-lock\.json|apps/windows/ui/package\.json|apps/windows/ui/package-lock\.json|apps/windows/src-tauri/Cargo\.toml|apps/windows/src-tauri/Cargo\.lock|apps/windows/src-tauri/tauri\.conf\.json|core/Cargo\.toml|core/Cargo\.lock)$'
          if [ -n "$changed" ] && ! grep -vqE "$allowed" <<<"$changed"; then
            version_only=true
          else
            version_only=false
          fi
          echo "version_only=$version_only" >> "$GITHUB_OUTPUT"
          # Every job below tests core/, so a diff that doesn't touch core/ (or these
          # workflows) skips them: docs, apps/macos, apps/windows, scripts. An empty
          # or failed diff (a new branch, a force push) runs everything.
          if [ "$version_only" = false ] && { [ -z "$changed" ] || grep -qE '^(core/|\.github/workflows/)' <<<"$changed"; }; then
            echo "run_core=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_core=false" >> "$GITHUB_OUTPUT"
          fi
          # The two Windows jobs share one PC, so they run only for what Windows builds or reads.
          # A change to another workflow file (release-integrity.yml, website.yml) no longer
          # runs them; only this file does. Mac, iOS, Android, website and docs changes skip them.
          # windows (core/): core/skins' tests read skins/ and themes/.
          if [ "$version_only" = false ] && { [ -z "$changed" ] || grep -qE '^(core/|skins/|themes/|\.github/workflows/rust-tests\.yml$)' <<<"$changed"; }; then
            echo "run_windows=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_windows=false" >> "$GITHUB_OUTPUT"
          fi
          # windows-app: apps/windows path-depends on core/, and its build and tests also read
          # skins/, themes/, l10n/languages.json, VERSION, mcp-servers/ (the bundled connectors),
          # server/src/aiProxy.ts (the price table), the Mac Today layouts and the Mac benchmark clip.
          windows_app_paths='^(apps/windows/|core/|skins/|themes/|l10n/|mcp-servers/|VERSION$|server/src/aiProxy\.ts$|apps/macos/Whimbrel/UI/Today/Archetypes/|apps/macos/Whimbrel/Support/engine-benchmark\.wav$|\.github/workflows/rust-tests\.yml$)'
          if [ "$version_only" = false ] && { [ -z "$changed" ] || grep -qE "$windows_app_paths" <<<"$changed"; }; then
            echo "run_windows_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_windows_app=false" >> "$GITHUB_OUTPUT"
          fi
          # The Android app (apps/mobile/android) links core/ through JNI and reads themes/.
          # android-app (Gradle tests, debug APK, release native build) is the most expensive
          # hosted job here, about 17 billed Linux minutes a run (#ci-minutes). Like ios, on a
          # pull request it runs only when a file the Android app itself owns changed, or
          # core/ffi/: the app's JNI layer (apps/mobile/android/app/src/main/cpp) calls the C
          # API in core/ffi/include/whimbrel_core.h, which the android job never builds against.
          # The rest of core/ is left out, since the android job above still cross-compiles
          # core/ for Android on every core/ PR. The nightly schedule run (an empty diff runs
          # everything) builds the app against main, so any other core/ change that breaks it
          # (a JSON shape the app reads, say) is caught overnight.
          android_app_paths='^(apps/mobile/android/|core/ffi/|themes/|\.github/workflows/)'
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            android_app_paths='^(apps/mobile/android/|core/|themes/|\.github/workflows/)'
          fi
          if [ "$version_only" = false ] && { [ -z "$changed" ] || grep -qE "$android_app_paths" <<<"$changed"; }; then
            echo "run_android_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_android_app=false" >> "$GITHUB_OUTPUT"
          fi
          # The iOS app (apps/mobile/ios) builds core/ffi and references the Mac app's shared
          # Support/ sources and themes/, so any of those runs the ios job.
          # This job runs on a HOSTED macOS runner, which bills at 10x a Linux minute. On a
          # pull request it therefore runs only when a file the iOS app itself owns changed
          # (core/ is left out: test-linux, android and windows already build and test it on
          # every core/ PR). On a push to main it also runs for core/, so a core/ change that
          # breaks the iOS build is still caught, one merge later instead of on the PR.
          ios_paths='^(apps/mobile/ios/|apps/macos/Whimbrel/Support/|themes/|scripts/l10n/|l10n/|\.github/workflows/)'
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            ios_paths='^(apps/mobile/ios/|apps/macos/Whimbrel/Support/|themes/|scripts/l10n/|l10n/|core/|\.github/workflows/)'
          fi
          if [ "$version_only" = false ] && { [ -z "$changed" ] || grep -qE "$ios_paths" <<<"$changed"; }; then
            echo "run_ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_ios=false" >> "$GITHUB_OUTPUT"
          fi

  # Pure-Rust unit tests on Linux (1x billing) on every push that touches core/.
  #
  # sync-engine is excluded from test execution for the same reason the
  # windows job already excludes it (see the comment there): rustc's default
  # linker on this target (rust-lld) hits the identical rusqlite-bundled /
  # libsql-ffi duplicate sqlite3-symbol conflict that MSVC's link.exe hits on
  # Windows. Confirmed by running this job before adding the exclusion --
  # macOS's ld64 tolerates the duplicate symbols; lld and link.exe don't.
  test-linux:
    needs: changes
    # Nightly and on demand only (#ci-minutes, 2026-11-12): pull requests already test core/
    # on the self-hosted Windows runner (and on the Mac after merge), so Linux only adds
    # lld's stricter linking and the retrieval eval, which a nightly run catches.
    if: needs.changes.outputs.run_core == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.linux))
    runs-on: ubuntu-latest
    # 45: since the encrypted suites were added (X4 Task 13), runs that finished took 11-29 min,
    # and 12 of 27 manual runs (2026-11-12..17) hit the old 30-min limit with no result. A timed-out
    # run bills its 30 minutes and answers nothing (CI cost review, 2026-11-17).
    timeout-minutes: 45
    steps:
      # The workspace's debug test binaries (memory, api, skins and ingest each link candle and SQLite)
      # outgrew the hosted runner's free disk on 2026-10-29 ("No space left on device" while linking).
      # The image ships toolchains this job never uses; removing them frees about 20-30 GB.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: core/mcp-host/tests/fixtures/package-lock.json
      # mcp-host's and ffi's tests spawn tests/fixtures/echo-server.mjs under node;
      # its dependencies are installed here rather than vendored in the repo.
      - name: Install the MCP echo-server test fixture
        working-directory: core/mcp-host/tests/fixtures
        run: npm ci
      - name: Re-download sherpa-onnx libraries the cache left out
        # sherpa-onnx-sys's build script downloads its static libraries into
        # core/target/sherpa-onnx-prebuilt and reuses that folder whenever its lib directory
        # exists, without checking the files. A restored cache can bring the folder back
        # without the libraries, while the cached build-script output still points there. Anything that
        # recompiles sherpa-onnx-sys (a Cargo.lock change) then fails with "could not find
        # native static library sherpa-onnx-c-api". When the libraries are missing, drop the
        # build script's cached output so it runs again and downloads them.
        shell: bash
        run: |
          if ! ls core/target/sherpa-onnx-prebuilt/*/lib/*sherpa-onnx-c-api.* >/dev/null 2>&1; then
            echo "No usable sherpa-onnx libraries in core/target; forcing the build script to download them"
            rm -rf core/target/sherpa-onnx-prebuilt core/target/*/build/sherpa-onnx-sys-* core/target/*/.fingerprint/sherpa-onnx-sys-*
          fi
      - name: Run cargo test
        working-directory: core
        run: cargo test --workspace --exclude sync-engine --exclude cloud-runner
      # The encrypted suites run per package (-p): a --workspace run unifies core/phone-tests'
      # libsql `core` feature into every test binary, and its bundled SQLite shadows SQLCipher.
      - name: Run memory suite with SQLCipher
        working-directory: core
        run: cargo test --lib --tests -p memory --features sqlcipher
      - name: Run api suite on the encrypted store
        working-directory: core
        run: cargo test --lib --tests -p api --features sqlcipher
      - name: Run keyed open over the C ABI and the MCP server's stdin key with SQLCipher
        working-directory: core
        run: |
          cargo test -p ffi --features sqlcipher --test store_key_ffi --test store_key_e2e --test encrypt_setup_ffi --test launch_ffi --test launch_e2e --test launch_actions_ffi
          cargo test -p mcp-server --features sqlcipher --test stdin_key
      - name: Build sync-engine and cloud-runner (compile-only, see exclusion note above; cloud-runner's tests use libsql's core feature, so they hit the same duplicate-symbol link error)
        working-directory: core
        run: cargo build -p sync-engine -p cloud-runner
      # The retrieval eval on the seeded corpus with the fake embedder: keyword
      # retrieval, fusion, decay and the context budget, against the committed baseline.
      # Non-blocking this round (no --strict): the step summary carries the table and any
      # metric that moved by more than two points. docs/superpowers/specs/2026-11-04-eval-harness-design.md.
      - name: Retrieval eval (fake embedder, against the baseline)
        working-directory: core
        run: cargo run -q -p eval -- retrieval --profile full --baseline eval/baselines/retrieval-fake.json | tee -a "$GITHUB_STEP_SUMMARY"

  # Self-hosted jobs run only in the upstream repository and never for a pull request
  # from a fork: a fork's own CI has no such runner, and a public repository must not
  # execute untrusted PR code on the maintainer's machines.
  # Runs on a self-hosted macOS runner (whimbrel-mbp-runner) -- GitHub-hosted
  # macOS runners bill at 10x a Linux minute, and test-linux already runs
  # these unit tests on every PR. This job runs only after merge, on the push
  # to main, where it adds macOS linking and the real-model integration
  # tests. Cargo-only (no xcodebuild/app bundle involved), so self-hosting
  # here has none of swift-tests's UserDefaults/Application Support
  # collision with the real installed app -- see release-integrity.yml.
  test:
    needs: changes
    if: needs.changes.outputs.run_core == 'true' && github.event_name != 'pull_request' && github.event_name != 'schedule' && github.repository == 'mpointer/kestrel'
    runs-on: ${{ fromJSON(vars.MAC_BIG_CI == 'on' && '["self-hosted","mac-pool"]' || '["self-hosted","macOS"]') }}
    # 45, not 30, since the SQLCipher step was added (X4 Task 13; not yet measured).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Self-hosted runners use their preinstalled, isolated toolchain (CARGO_HOME and
      # RUSTUP_HOME in the runner's .env) rather than a toolchain action.
      - name: Rust toolchain (preinstalled on this runner)
        run: |
          rustup show active-toolchain
          cargo --version
      # cache-bin: false. With the default (true), the save step on main prunes
      # CARGO_HOME/bin to cargo-installed binaries, which deletes rustup and leaves
      # every proxy dangling. A self-hosted runner keeps CARGO_HOME between runs.
      # save-if: false. These jobs only restore. Saving on main took about 6 minutes
      # to compress and upload core/target (928 MB on Windows), so they keep
      # restoring the last cache main saved and cargo rebuilds whatever changed.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          save-if: false
          cache-bin: false
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      # mcp-host's and ffi's tests spawn tests/fixtures/echo-server.mjs under node;
      # its dependencies are installed here rather than vendored in the repo.
      - name: Install the MCP echo-server test fixture
        working-directory: core/mcp-host/tests/fixtures
        run: npm ci
      - name: Re-download sherpa-onnx libraries the cache left out
        # sherpa-onnx-sys's build script downloads its static libraries into
        # core/target/sherpa-onnx-prebuilt and reuses that folder whenever its lib directory
        # exists, without checking the files. A restored cache can bring the folder back
        # without the libraries, while the cached build-script output still points there. Anything that
        # recompiles sherpa-onnx-sys (a Cargo.lock change) then fails with "could not find
        # native static library sherpa-onnx-c-api". When the libraries are missing, drop the
        # build script's cached output so it runs again and downloads them.
        shell: bash
        run: |
          if ! ls core/target/sherpa-onnx-prebuilt/*/lib/*sherpa-onnx-c-api.* >/dev/null 2>&1; then
            echo "No usable sherpa-onnx libraries in core/target; forcing the build script to download them"
            rm -rf core/target/sherpa-onnx-prebuilt core/target/*/build/sherpa-onnx-sys-* core/target/*/.fingerprint/sherpa-onnx-sys-*
          fi
      - name: Run cargo test
        working-directory: core
        run: cargo test --workspace
      # X4 encryption at rest: SQLCipher on vendored OpenSSL (macOS needs no extra toolchain).
      # Per package (-p), never --workspace: core/phone-tests' libsql `core` feature would be
      # unified into every test binary and its bundled SQLite shadows SQLCipher.
      - name: SQLCipher keyed open, ffi build and the api suite on the encrypted store
        working-directory: core
        run: |
          cargo test -p memory --features sqlcipher --test keyed_open
          cargo build -p ffi --features sqlcipher
          cargo test --lib --tests -p api --features sqlcipher
      - name: Download pinned embedding model (real-model integration only)
        working-directory: core/memory
        # The folder and revision match memory::EMBEDDING_MODEL_ID / _REVISION; a versioned
        # folder, so an existing file is always this model's and can be kept.
        run: |
          dir=models/paraphrase-multilingual-minilm-l12-v2
          rev=e8f8c211226b894fcb81acc59f3b34ba3efd5f42
          mkdir -p "$dir"
          for f in config.json tokenizer.json model.safetensors; do
            [ -f "$dir/$f" ] || curl -fL --retry 3 -o "$dir/$f" "https://huggingface.co/sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2/resolve/$rev/$f"
          done
      - name: Run real-model integration tests
        working-directory: core
        run: cargo test -p memory -- --ignored
      # The same retrieval eval on the real embedding model, so an embedding change shows
      # here. No real-model baseline is committed yet; the table lands in the step summary
      # and the first few runs decide the baseline.
      - name: Retrieval eval (real embedding model)
        working-directory: core
        run: cargo run -q -p eval -- retrieval --profile full --real-model memory/models | tee -a "$GITHUB_STEP_SUMMARY"

  # Runs on PRs that touch core/ as well as on main: MSVC link failures (LNK2005,
  # see below) only show up here. It runs on the author's Windows PC (a self-hosted
  # runner labelled kestrel-windows, C:\ar or C:\ar2, started at sign-in) instead of
  # windows-latest, which bills at 2x a Linux minute. The PC provides Rust (MSVC)
  # and VS Build Tools with CMake and Clang; the runner's .env sets PATH (rustup,
  # cmake, cargo), LIBCLANG_PATH and core.fsmonitor=false (see
  # apps/windows/scripts/install-actions-runner.ps1). While the PC is off or asleep
  # this job waits.
  # PRs and manual runs only: a squash merge to main lands the exact tree its PR already
  # ran here.
  #
  # One heavy Windows job at a time. Both runner instances share one PC, and two Rust jobs
  # side by side each took twice as long: on 2026-11-23 two `windows` jobs ran together and
  # both were cut off at 60 min. With the repository variable WINDOWS_HEAVY set to on, this
  # job, windows-app and release-windows.yml ask for the label kestrel-windows-heavy, which
  # only one runner instance has, so GitHub queues them one after another. Unset (or no
  # runner has the label yet), they go to either instance as before. Add the label first,
  # then set the variable: a job asking for a label no online runner has just waits.
  # Not a concurrency group: a group keeps one pending job and cancels the older one.
  windows:
    needs: changes
    if: needs.changes.outputs.run_windows == 'true' && github.repository == 'mpointer/kestrel' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch')
    runs-on: ${{ fromJSON(vars.WINDOWS_HEAVY == 'on' && '["self-hosted","Windows","X64","kestrel-windows","kestrel-windows-heavy"]' || '["self-hosted","Windows","X64","kestrel-windows"]') }}
    # 90. Measured over the last 25 runs (2026-11-22..23, every attempt): alone the job took
    # 26-57 min, two side by side were cut off at 60. The memory and api suites now run once
    # (with SQLCipher) instead of twice, and the build directory persists, which takes about
    # 12 min off a typical run and about 22 min off the slowest. That leaves about 35 min
    # alone; 90 still covers two jobs side by side (about 2x) until the heavy label is on.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Tests make temp folders (tempfile .tmp*, whimbrel-*). On Windows a folder whose SQLite file is still open
      # when the test ends (a store closing on another thread) cannot be deleted, so thousands were left in the
      # PC user's %TEMP% every day. The runner empties RUNNER_TEMP at the start and end of every job, so the
      # tests use a folder inside it and whatever they leave goes with the job.
      - name: Temp folder inside the job's temp directory
        shell: powershell
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'tmp'
          New-Item -ItemType Directory -Force $t | Out-Null
          "TMP=$t", "TEMP=$t" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "TMP=$t"
      # Self-hosted runners use their preinstalled, isolated toolchain (CARGO_HOME and
      # RUSTUP_HOME in the runner's .env) rather than a toolchain action. cargo-nextest is
      # optional: when the PC has it (cargo install cargo-nextest --locked), the test steps
      # use it to run test binaries side by side; otherwise they use cargo test.
      - name: Rust toolchain (preinstalled on this runner)
        shell: powershell
        run: |
          rustup show active-toolchain
          cargo --version
          if (Get-Command cargo-nextest -ErrorAction SilentlyContinue) { cargo nextest --version } else { Write-Host "cargo-nextest not installed; the tests run with cargo test" }
      # One build directory for the whole job, beside the runner's _work and kept between runs
      # (checkout cleans core/target, and no Windows rust-cache was ever saved: every run
      # compiled the workspace from scratch). Plain and SQLCipher builds share it: cargo keeps
      # each feature set's output apart, and the dependencies both use compile once. It is
      # t-sqlc, where the SQLCipher steps already built, so its vendored OpenSSL is reused.
      - name: Build directory for this runner instance
        shell: powershell
        run: |
          $root = Split-Path -Parent (Split-Path -Parent $env:RUNNER_TEMP)
          $target = Join-Path $root 't-sqlc'
          "CARGO_TARGET_DIR=$target" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "CARGO_TARGET_DIR=$target"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      # mcp-host's and ffi's tests spawn tests/fixtures/echo-server.mjs under node;
      # its dependencies are installed here rather than vendored in the repo.
      - name: Install the MCP echo-server test fixture
        working-directory: core/mcp-host/tests/fixtures
        run: npm ci
      - name: Re-download sherpa-onnx libraries the build directory lacks
        # See the same step in test-linux: when the downloaded sherpa-onnx libraries are
        # missing, drop the build script's cached output so it runs again and downloads them.
        shell: powershell
        run: |
          $t = $env:CARGO_TARGET_DIR
          $libs = Get-ChildItem -Path "$t/sherpa-onnx-prebuilt" -Recurse -Filter '*sherpa-onnx-c-api*' -ErrorAction SilentlyContinue
          if (-not $libs) {
            Write-Host "No usable sherpa-onnx libraries in $t; forcing the build script to download them"
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$t/sherpa-onnx-prebuilt"
            Get-ChildItem -Path "$t/*/build", "$t/*/.fingerprint" -Directory -Filter 'sherpa-onnx-sys-*' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force
          }
      # memory and api are left out here: their suites run once, below, on the encrypted store
      # (SQLCipher), the store the Windows app ships. Before, they ran here too on a plain store,
      # about 22 of this step's minutes for the same tests. The plain store (phones) is still
      # tested by the nightly Linux run and the Mac run after merge.
      - name: Test pure-Rust crates
        working-directory: core
        shell: powershell
        run: |
          $pkgs = '--workspace', '--exclude', 'memory', '--exclude', 'api', '--exclude', 'transcribe', '--exclude', 'diarize', '--exclude', 'ffi', '--exclude', 'sync-engine', '--exclude', 'cloud-runner'
          if (Get-Command cargo-nextest -ErrorAction SilentlyContinue) {
            cargo nextest run @pkgs
            if ($LASTEXITCODE -ne 0) { throw "tests failed" }
            # nextest doesn't run doctests.
            cargo test --doc @pkgs
            if ($LASTEXITCODE -ne 0) { throw "doctests failed" }
          } else {
            cargo test @pkgs
            if ($LASTEXITCODE -ne 0) { throw "tests failed" }
          }
      # The tests that exist only without SQLCipher (cfg(not(feature = "sqlcipher"))): a build
      # without it must refuse a keyed open and the encryption migration must fail closed. Plus
      # memory's and api's doctests and api's examples, which the --lib --tests runs below leave out.
      # The list check fails the step if a rename leaves the filter matching fewer tests than expected.
      - name: Test memory and api without SQLCipher (the plain-build-only tests and doctests)
        working-directory: core
        shell: powershell
        run: |
          $runs = @(
            @{ args = @('-p', 'memory', '--lib', '--test', 'keyed_open'); filter = @('cipher_version_missing', 'without_feature'); min = 2 },
            @{ args = @('-p', 'api', '--lib', '--test', 'encrypt_migration'); filter = @('without_sqlcipher'); min = 2 }
          )
          foreach ($r in $runs) {
            $a = $r.args; $f = $r.filter
            $listed = @(cargo test @a -- --list @f | Where-Object { $_ -match ': test$' })
            if ($LASTEXITCODE -ne 0) { throw "cargo test $a --list failed" }
            $listed | ForEach-Object { Write-Host $_ }
            if ($listed.Count -lt $r.min) { throw "expected at least $($r.min) plain-build-only tests in $a, found $($listed.Count)" }
            cargo test @a -- @f
            if ($LASTEXITCODE -ne 0) { throw "cargo test $a failed" }
          }
          cargo test -p memory -p api --doc
          if ($LASTEXITCODE -ne 0) { throw "memory and api doctests failed" }
          # api's examples, which the workspace run used to compile.
          cargo build -p api --examples
          if ($LASTEXITCODE -ne 0) { throw "api examples failed to build" }
      - name: Build native-dependent crates (compile-only, no test)
        working-directory: core
        run: cargo build -p transcribe -p diarize -p ffi
      # sync-engine is build-only here (no test execution): rusqlite-bundled and
      # libsql's core-feature bundled sqlite3 both define the same sqlite3 C symbols,
      # which MSVC's link.exe rejects as duplicate symbols (LNK2005), so its test
      # binary can't link on Windows. cloud-runner's tests use libsql's core feature too, so it is
      # build-only here as well; its tests run on the Mac.
      - name: Build sync-engine and cloud-runner (compile-only)
        working-directory: core
        run: cargo build -p sync-engine -p cloud-runner
      # X4 encryption at rest (issue #816): SQLCipher on vendored OpenSSL. Building OpenSSL needs
      # Strawberry Perl (PERL) and NASM on the runner; on FEYNMAN both are in the runner tasks'
      # user environment (2026-11-14). The build directory is kept between runs, so OpenSSL
      # compiles once, not every run.
      - name: SQLCipher toolchain
        shell: powershell
        run: |
          if (-not $env:PERL -or -not (Test-Path $env:PERL)) { throw "PERL is not set to Strawberry Perl on this runner (issue #816)" }
          & $env:PERL -e 'require Locale::Maketext::Simple; print qq(Strawberry Perl $^V)'
          if ($LASTEXITCODE -ne 0) { throw "this Perl can't build OpenSSL" }
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) { throw "nasm is not on PATH on this runner (issue #816)" }
          nasm -v
      # The full memory and api suites on the encrypted store (keyed open, Delete everything,
      # the encryption migration, keyed launch decisions), per package (-p), never --workspace:
      # core/phone-tests' libsql `core` feature would be unified in and shadow SQLCipher.
      # api's sqlcipher feature turns on memory's, so one run covers both crates' tests.
      - name: Test memory and api with SQLCipher
        working-directory: core
        shell: powershell
        run: |
          $sel = '-p', 'memory', '-p', 'api', '--features', 'memory/sqlcipher,api/sqlcipher', '--lib', '--tests'
          if (Get-Command cargo-nextest -ErrorAction SilentlyContinue) {
            cargo nextest run @sel
          } else {
            cargo test @sel
          }
          if ($LASTEXITCODE -ne 0) { throw "memory and api sqlcipher tests failed" }
      - name: Build ffi with SQLCipher
        working-directory: core
        shell: powershell
        run: |
          cargo build -p ffi --features sqlcipher
          if ($LASTEXITCODE -ne 0) { throw "ffi sqlcipher build failed" }

  # The Tauri shell and its React UI (apps/windows). Nothing else in CI builds them.
  # Runs on the same self-hosted PC as `windows`. The UI builds first because the
  # Tauri crate embeds ui/dist at compile time. CARGO_TARGET_DIR is short and outside
  # the checkout: whisper.cpp's MSBuild step fails past 260 characters, and a
  # persistent target on this runner keeps rebuilds incremental without rust-cache.
  # Each runner instance on the PC has its own (C:\ar\t-win, C:\ar2\t-win), so two
  # instances never wait on each other's cargo lock. With WINDOWS_HEAVY on, only the
  # instance with the kestrel-windows-heavy label takes this job (see the windows job).
  # Build from src-tauri/ so its .cargo/config.toml (+crt-static) applies.
  windows-app:
    # Runs after the windows job (pass, fail or skipped): FEYNMAN is the only
    # Windows runner, and a second Windows job queued beside the first can
    # time out with no runner before it starts.
    needs: [changes, windows]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.run_windows_app == 'true' && github.repository == 'mpointer/kestrel' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ fromJSON(vars.WINDOWS_HEAVY == 'on' && '["self-hosted","Windows","X64","kestrel-windows","kestrel-windows-heavy"]' || '["self-hosted","Windows","X64","kestrel-windows"]') }}
    # 60. Measured over the last 25 runs (2026-11-22..23, every attempt): 13-26 min alone,
    # up to 34 min beside another Windows job. 60 is almost 2x the worst case seen.
    timeout-minutes: 60
    steps:
      # The runner's own directory is the parent of _work (RUNNER_TEMP is _work\_temp). The skin
      # matrix's preview server gets a free port, so a second instance's job doesn't collide on 4180.
      - name: Build directory and preview port for this runner instance
        shell: powershell
        run: |
          $root = Split-Path -Parent (Split-Path -Parent $env:RUNNER_TEMP)
          $target = Join-Path $root 't-win'
          if ($target.Length -gt 22) { throw "CARGO_TARGET_DIR is too long for whisper's Vulkan build: $target" }
          $probe = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $probe.Start(); $port = $probe.LocalEndpoint.Port; $probe.Stop()
          "CARGO_TARGET_DIR=$target", "MATRIX_PORT=$port" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "CARGO_TARGET_DIR=$target MATRIX_PORT=$port"
      - uses: actions/checkout@v4
      # Tests make temp folders (tempfile .tmp*, whimbrel-*). On Windows a folder whose SQLite file is still open
      # when the test ends (a store closing on another thread) cannot be deleted, so thousands were left in the
      # PC user's %TEMP% every day. The runner empties RUNNER_TEMP at the start and end of every job, so the
      # tests use a folder inside it and whatever they leave goes with the job.
      - name: Temp folder inside the job's temp directory
        shell: powershell
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'tmp'
          New-Item -ItemType Directory -Force $t | Out-Null
          "TMP=$t", "TEMP=$t" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "TMP=$t"
      # Self-hosted runners use their preinstalled, isolated toolchain (CARGO_HOME and
      # RUSTUP_HOME in the runner's .env) rather than a toolchain action.
      - name: Rust toolchain (preinstalled on this runner)
        run: |
          rustup show active-toolchain
          cargo --version
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      # Whisper's Vulkan build needs the SDK (scripts/dev-env.ps1). The runner's service may have started
      # before it was installed, so read the machine-wide value.
      - name: Vulkan SDK (whisper's GPU build)
        shell: powershell
        run: |
          $sdk = [Environment]::GetEnvironmentVariable('VULKAN_SDK', 'Machine')
          if (-not $sdk -or -not (Test-Path "$sdk\Bin\glslc.exe")) { throw "The Vulkan SDK isn't installed on this runner: winget install KhronosGroup.VulkanSDK" }
          "VULKAN_SDK=$sdk" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$sdk\Bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: UI install
        working-directory: apps/windows/ui
        run: npm ci
      - name: UI tests
        working-directory: apps/windows/ui
        run: npm test
      - name: Generated TS types are current
        working-directory: apps/windows/ui
        run: npm run check:types
      - name: UI build (tsc + vite, produces ui/dist)
        working-directory: apps/windows/ui
        run: npm run build
      - name: Tauri shell unit tests
        working-directory: apps/windows/src-tauri
        run: cargo test --lib
      # Today under every shipped skin, palette and appearance, and the worst-case skin, in the Edge already on
      # the runner: nothing may overrun, overlap or fall under 4.5:1. The skins come from the shell, as the app gets them.
      - name: Skin no-overrun matrix (Edge)
        working-directory: apps/windows/ui
        run: |
          npm run matrix:skins
          npx playwright test
      # The release job runs this before it packages the installer, and a release is the wrong
      # first place to find it broken.
      - name: MCP server program builds and stages for the installer
        shell: powershell
        run: ./apps/windows/scripts/prepare-sidecar.ps1 -ForBundle
      - name: Node and the connectors stage for the installer (pinned hash)
        shell: powershell
        run: ./apps/windows/scripts/prepare-bundle-resources.ps1
      - name: No libsql core feature in the graph
        working-directory: apps/windows/src-tauri
        shell: powershell
        run: ..\scripts\check-no-libsql-core.ps1

  android:
    needs: changes
    # Not on a push to main (the PR ran it on the same code; the nightly run covers main).
    # A manual run only with `linux` set (see the workflow_dispatch input).
    if: needs.changes.outputs.run_core == 'true' && github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.linux)
    # Stays on Linux: whisper-rs-sys 0.15's build script tests cfg!(target_os = "macos") for the
    # HOST, so on a Mac it links ggml-blas into the Android build and fails ("could not find
    # native static library ggml-blas"). The app itself (android-app) builds ffi without it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Add Android target
        run: rustup target add aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version "4.1.2"
      - name: Cross-compile workspace for Android (build/check only — no test execution is possible on this host)
        working-directory: core
        # RUSTFLAGS enables the fp16 target feature: gemm-f16 (pulled in by candle-core,
        # a dependency of the memory crate's local embedding model) emits `fullfp16` NEON
        # inline asm that the baseline aarch64-linux-android codegen target rejects
        # ("instruction requires: fullfp16") without it. Note this makes the resulting
        # binaries require an ARMv8.2-A+ (FEAT_FP16) device at runtime.
        #
        # diarize is excluded: sherpa-onnx-sys v1.13.4's build.rs has no prebuilt ONNX
        # Runtime archive for os=android arch=aarch64 ("Unsupported target for
        # sherpa-onnx prebuilt libs"). ffi is built too, but with its default `diarize`
        # feature off (--no-default-features), so it does not pull in diarize.
        # transcribe (whisper-rs-sys via CMake) cross-compiles cleanly and is NOT excluded.
        env:
          RUSTFLAGS: -C target-feature=+fp16
        run: |
          cargo ndk -t arm64-v8a build --workspace --exclude diarize --exclude ffi
          cargo ndk -t arm64-v8a build -p ffi --no-default-features

  # The Android app: Gradle unit tests, a debug APK, and a release native build so the
  # release link of the Rust core is exercised too (release signing is not set up yet).
  # app/build.gradle.kts runs `cargo metadata` and reads the NDK at configuration time, so
  # the Rust toolchain, cargo-ndk, the NDK and CMake must all exist before any Gradle command.
  android-app:
    needs: changes
    # Not on a push to main; see test-linux. On a PR, only for Android-app files; see run_android_app.
    if: needs.changes.outputs.run_android_app == 'true' && github.event_name != 'push'
    # On the maintainer's Mac in the private repo (no billed minutes); GitHub-hosted in the
    # public mirror and for a pull request from a fork, so outside code never runs on it.
    # With the repository variable MAC_BIG_CI set to on, either Mac runner takes it (label mac-pool; an internal runbook covers it).
    runs-on: ${{ github.repository == 'mpointer/kestrel' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.MAC_BIG_CI == 'on' && '["self-hosted","mac-pool"]' || '["self-hosted","macOS"]') || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      # The Mac already has the SDK, NDK 27.2.12479018, CMake 3.22.1 and JDK 17; the hosted
      # image gets the NDK and CMake from sdkmanager below.
      - name: Android SDK, NDK and JDK paths
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            sdk="$HOME/Library/Android/sdk"
            { echo "ANDROID_HOME=$sdk"; echo "ANDROID_SDK_ROOT=$sdk"
              echo "JAVA_HOME=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home"; } >> "$GITHUB_ENV"
          else
            sdk="/usr/local/lib/android/sdk"
          fi
          echo "ANDROID_NDK_HOME=$sdk/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Android target
        run: rustup target add aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version "4.1.2"
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # A cached whisper-rs-sys build directory fails CMake's next configure on Android
      # ("add_subdirectory given source tests ... not an existing directory"), so every run after
      # a cache save broke. Drop it; only whisper rebuilds. The Mac runner builds in CARGO_TARGET_DIR.
      - name: Drop cached whisper-rs-sys build output
        shell: bash
        run: rm -rf "${CARGO_TARGET_DIR:-core/target}"/aarch64-linux-android/*/build/whisper-rs-sys-*
      - uses: actions/setup-java@v4
        if: runner.environment == 'github-hosted'
        with:
          distribution: temurin
          java-version: "17"
      - name: Install NDK and CMake
        if: runner.environment == 'github-hosted'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Unit tests and debug APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - name: Release build (unsigned)
        working-directory: apps/mobile/android
        env:
          WHIMBREL_UNSIGNED_RELEASE: "1"
        run: |
          ./gradlew :app:testReleaseUnitTest :app:assembleRelease
          find app/build -name 'lib*.so' -path '*elease*' -exec ls -l {} \; -exec file {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    needs: changes
    if: needs.changes.outputs.run_ios == 'true' && github.event_name != 'pull_request' && github.event_name != 'schedule' && github.repository == 'mpointer/kestrel'
    # Either Mac when MAC_BIG_CI is on. The test step below finds its simulator by name,
    # so each Mac needs one named "Whimbrel CI" (an internal runbook covers it).
    runs-on: ${{ fromJSON(vars.MAC_BIG_CI == 'on' && '["self-hosted","mac-pool"]' || '["self-hosted","macOS"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Self-hosted runners use their preinstalled, isolated toolchain (CARGO_HOME and
      # RUSTUP_HOME in the runner's .env) rather than a toolchain action.
      - name: Rust toolchain (preinstalled on this runner)
        run: |
          rustup show active-toolchain
          cargo --version
      # cache-bin: false keeps rustup alive on a self-hosted runner. Checkout clears core/target,
      # so this restores the cache and main keeps it fresh.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false
      - name: Add iOS targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      # Builds ffi for iOS device and simulator, then packs the xcframework the app links.
      # The script sets RUSTFLAGS=+fp16 and --no-default-features (no `diarize`:
      # sherpa-onnx-sys has no prebuilt ONNX Runtime for iOS; fp16 for the same
      # candle/gemm-f16 `fullfp16` NEON asm reason as the android job). Release, as shipped:
      # the dev profile's huge libsql parser stack frames overflow the app's store thread.
      - name: Build ffi xcframework (device + simulator)
        run: ./apps/mobile/ios/scripts/build-ffi-xcframework.sh
      # Uses the committed Whimbrel.xcodeproj (regenerate with xcodegen after project.yml
      # changes). No signing on CI.
      - name: Build iOS app for the simulator
        run: |
          xcodebuild build -project apps/mobile/ios/Whimbrel.xcodeproj -scheme Whimbrel \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      # Every Swift string must already be in the committed catalog (export-apple.sh restores the
      # catalogs after -exportLocalizations rewrites them, so this compares against the committed files).
      - name: Check the string catalogs match the Swift source
        run: |
          scripts/l10n/export-apple.sh ios "$RUNNER_TEMP/loc"
          python3 -I scripts/l10n/translate.py check --apple "$RUNNER_TEMP/loc"/en.xcloc apps/mobile/ios/Whimbrel/Localizable.xcstrings
          python3 -I scripts/l10n/translate.py check --apple "$RUNNER_TEMP/loc"/en.xcloc apps/mobile/ios/Whimbrel/InfoPlist.xcstrings
      # Unit tests (WhimbrelTests: the enrollment model, with a fake backend and the
      # in-memory Keychain, so no signing is needed). One runner is Mike's MacBook, so
      # the simulator is the one set aside for CI, never the one Mike uses: the one named
      # "Whimbrel CI" in the runner's account. The MacBook's older CI simulator has
      # another name, so it is found by its id when the name is absent.
      - name: Test iOS app on a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -I -c '
          import json, sys
          devices = [d for group in json.load(sys.stdin)["devices"].values() for d in group]
          named = [d["udid"] for d in devices if d["name"] == "Whimbrel CI"]
          older = [d["udid"] for d in devices if d["udid"] == "057DA530-5C3E-42C7-B8F2-4A98AFAB3E7E"]
          print((named or older or [""])[0])')
          if [ -z "$udid" ]; then
            echo "No simulator named \"Whimbrel CI\" in this runner's account. Create one: xcrun simctl create \"Whimbrel CI\" \"iPhone 18 Pro\"" >&2
            exit 1
          fi
          echo "simulator: $udid"
          xcodebuild test -project apps/mobile/ios/Whimbrel.xcodeproj -scheme Whimbrel \
            -destination "id=$udid" CODE_SIGNING_ALLOWED=NO
