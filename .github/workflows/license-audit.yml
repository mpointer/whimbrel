# Third-party license audit for the Rust workspace (core/deny.toml). Fails when a
# crate in the dependency graph carries a license outside the allow list or comes
# from an unknown registry or git source. Needs no secrets, so it runs on forks.
name: License audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "core/**/Cargo.toml"
      - "core/Cargo.lock"
      - "core/deny.toml"
      - ".github/workflows/license-audit.yml"
  push:
    branches: [main]
    paths:
      - "core/**/Cargo.toml"
      - "core/Cargo.lock"
      - "core/deny.toml"
      - ".github/workflows/license-audit.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only a PR cancels what it supersedes; main and tags always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  cargo-deny:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core/Cargo.toml
          command: check licenses sources
