name: Localization

# translate.py's unit tests (a fake model client; no network, no key) and the offline catalog
# check: every shipped language has every key (deltas-only variants exempt), placeholders and
# plural forms match the English. The Apple source-vs-catalog check needs xcodebuild, so it runs
# in release-integrity.yml (macOS) and rust-tests.yml (iOS).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["docs/**", "**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only a PR cancels what it supersedes; main and tags always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  l10n:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: translate.py unit tests
        run: python3 -I -m unittest discover -s scripts/l10n -v
      - name: Catalog check
        run: python3 -I scripts/l10n/translate.py check
