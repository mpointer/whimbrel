# Marketing site (website/): SEO-checked static build, Worker typecheck and tests.
name: website

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["website/**", ".github/workflows/website.yml"]
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only a PR cancels what it supersedes; main and tags always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # sitemap lastmod comes from git history
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      # npm 10 crashes resolving vitest's optional peers; npm 11 doesn't.
      - run: npx --yes npm@11 ci
      - run: npm run typecheck
      - run: npm test
