[package]
name = "whimbrel-windows"
version = "0.9.37"
edition = "2021"
publish = false
# Two binaries (the app and the M3.1 capture-spike CLI); the Tauri CLI builds and
# runs this one.
default-run = "whimbrel-windows"

# The Windows shell is its own Cargo workspace with path dependencies into core/ —
# docs/12-windows-app-design.md §3. It links Windows-only APIs, so it must never be a
# member of core/'s workspace (that would break `cargo test --workspace` on the macOS,
# Linux, and Android CI jobs).
#
# It must also never enable libsql's `core` feature: that bundles a second SQLite that
# collides with rusqlite's (LNK2005 on MSVC). sync-engine's non-test dependency enables
# only `remote` + `tls`; keep it that way. `scripts/check-no-libsql-core.ps1` verifies.
[workspace]

[lib]
name = "whimbrel_windows"
path = "src/lib.rs"

# M3.1 capture spike: a CLI with no UI (§9). The capture modules under src/capture/ are
# the ones the M3.2 Tauri shell will call; the binary is measurement scaffolding.
[[bin]]
name = "capture-spike"
path = "src/bin/capture_spike.rs"

# Writes ui/src/generated/schema.json from the command DTOs (plan Decision 11).
[[bin]]
name = "gen-schema"
path = "src/bin/gen_schema.rs"

[dependencies]
api = { path = "../../../core/api" }
memory = { path = "../../../core/memory" }
agent = { path = "../../../core/agent" }
routines = { path = "../../../core/routines" }
transcribe = { path = "../../../core/transcribe" }
diarize = { path = "../../../core/diarize" }
skins = { path = "../../../core/skins" }
# Same version core/diarize pins. Only `capture-spike diarize-bench` uses it directly, to
# time the pipeline at thread counts core/diarize does not expose (M3.1 finding).
sherpa-onnx = "1.13.4"
hound = "3"
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
# The Tauri shell (M3.2). `tray-icon`: the app is tray-resident (docs/12 §4, W2).
# `image-ico`: the tray's state icons are .ico files (Task 10).
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-single-instance = "2"
# Start at login through HKCU `Run` (Task 10; docs/12 §4).
tauri-plugin-autostart = "2"
# Auto-update (M3.5; docs/12 §7): a minisign-signed `windows/latest.json` on the updates
# Worker, installed by the NSIS installer in passive mode.
tauri-plugin-updater = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
# M3.2 Task 2: store actor, device identity, secrets, settings, generated TS types.
sync = { path = "../../../core/sync" }
# Content sync (Task 6). Its libsql dependency is `remote` + `tls` only; `core` is a
# dev-dependency of sync-engine and never reaches this graph (check-no-libsql-core.ps1).
sync-engine = { path = "../../../core/sync-engine" }
ingest = { path = "../../../core/ingest" }
mcp-host = { path = "../../../core/mcp-host" }
llm = { path = "../../../core/llm" }
base64 = "0.22"
keyring = { version = "3", features = ["windows-native"] }
schemars = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }

[dependencies.windows]
# Same line core/Cargo.lock already resolves (0.62.2).
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_RemoteDesktop",
    "Win32_System_Power",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_Console",
    "Win32_Security",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_Packaging_Appx",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Authorization_AppCapabilityAccess",
    "System_UserProfile",
]

[dependencies.windows-core]
version = "0.62"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
debug = 1
# A panic anywhere ends the process, and the crash-restart mechanism brings it back
# (Task 10, docs/12 open question 4). This also means the store actor's catch_unwind no
# longer catches in release: a panicking store job restarts the app.
panic = "abort"
