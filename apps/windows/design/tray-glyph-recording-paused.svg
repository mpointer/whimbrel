<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 15.5 94 94">
  <!-- Tray glyph for a paused recording: the same mark as tray-glyph.svg with a pause badge (two bars) at the lower right, in the same colour. A band around the bars is cut out of the mark so the bars read as a separate shape at 16 px. The eye is cut out as in tray-glyph.svg and left out below 24 px by apps/windows/scripts/render-icons.mjs; the badge cut-out stays at every size. -->
  <mask id="eye">
    <rect x="0" y="0" width="120" height="120" fill="#fff" />
    <circle cx="68" cy="36.5" r="4.6" fill="#000" />
  </mask>
  <mask id="badge">
    <rect x="0" y="0" width="120" height="120" fill="#fff" />
    <rect x="60" y="64" width="50" height="52" rx="9" fill="#000" />
  </mask>
  <g fill="currentColor" mask="url(#eye)">
    <g mask="url(#badge)">
      <path d="M52,44 C50,62 52,84 55,100 L100,100 L100,74 C88,68 80,60 77,49 Z" />
      <circle cx="65" cy="40" r="15" />
      <path d="M53,32.5 C38,34 22,46 10,78 C9.2,80.2 11.2,81.4 12.6,79.6 C25,58 38,48.5 54,46.5 Z" />
    </g>
  </g>
  <g fill="currentColor">
    <rect x="68" y="72" width="13" height="35" rx="2.6" />
    <rect x="87" y="72" width="13" height="35" rx="2.6" />
  </g>
</svg>
